<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Discover your political ideology with only a few questions using a flowchart quiz.">
    <meta name="theme-color" content="#00a0ff">
    <title>IdeoSorter</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" type="image/png" href="./assets/logos/icon.png">
    <meta property="og:site_name" content="IdeoSorter">
    <meta property="og:title" content="IdeoSorter">
    <meta property="og:type" content="website">
    <meta property="og:description" content="Discover your political ideology with only a few questions using a flowchart quiz.">
    <meta property="og:url" content="https://quark88.github.io/ideosorter">
    <meta property="og:image" content="https://quark88.github.io/ideosorter/assets/logos/embed.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@RenaudBeaulieuQ">
    <meta name="twitter:title" content="IdeoSorter">
    <meta name="twitter:description" content="Discover your political ideology with only a few questions using a flowchart quiz.">
    <meta name="twitter:image" content="https://quark88.github.io/ideosorter/assets/logos/title.png">
</head>

<body>
    <aside id="sidebarLeft">
        <button id="toolsToggle" onclick="toggleTools()">
            <img id="toolsToggleIcon" src="./assets/buttons/labor.svg">
        </button>
        <div id="tools">
            <button onclick="show('home')">
                <img src="./assets/buttons/home.svg">
            </button>
            <button onclick="show('quiz')">
                <img src="./assets/buttons/yes.svg">
            </button>
            <button onclick="show('create')">
                <img src="./assets/buttons/create.svg">
            </button>
            <button onclick="show('about')">
                <img src="./assets/buttons/about.svg">
            </button>
            <button onclick="show('tree')">
                <img src="./assets/buttons/tree.svg">
            </button>
            <button onclick="toggleTheme()">
                <img id="themeToggleIcon" src="./assets/buttons/dark.svg">
            </button>
        </div>
    </aside>
    <div id="page">
        <header id="header">
            <div class="headerGap"></div>
            <img id="headerImage" src="./assets/logos/titleLight.svg">
            <div class="headerGap">
                <a>V3.0.0</a>
            </div>
        </header>
        <section id="home" class="content">
            <div id="homeMenu">
                <div id="intro">Discover your political ideology with only a few questions</div>
                <button id="buttonStart" onclick="show('quiz')">
                    <div>Start</div>
                    <img src="./assets/buttons/start.svg">
                </button>
                <button onclick="show('create')">
                    <img src="./assets/buttons/create.svg">
                    <div>Create</div>
                </button>
                <button onclick="show('about')">
                    <img src="./assets/buttons/about.svg">
                    <div>About</div>
                </button>
                <button onclick="show('tree')">
                    <img src="./assets/buttons/tree.svg">
                    <div>Tree</div>
                </button>
                <button id="buttonSlop" onclick="window.open('https://quark88.github.io/ideoslopper', '_blank')">
                    <img src="./assets/buttons/trash.svg">
                    <div>See the rejected ideology proposals here</div>
                </button>
            </div>
        </section>
        <section id="quiz" class="content">
            <div id="quizQuestion">Loading...</div>
            <div id="quizButtons">
                <button id="quizButton1" onclick="show('results')">
                    <img src="./assets/buttons/missing.svg">
                    <div>Loading...</div>
                </button>
                <button id="quizButton2" onclick="show('results')">
                    <img src="./assets/buttons/missing.svg">
                    <div>Loading...</div>
                </button>
                <button id="quizButton3">
                    <img src="./assets/buttons/missing.svg">
                    <div>Loading...</div>
                </button>
                <button id="quizButton4">
                    <img src="./assets/buttons/missing.svg">
                    <div>Loading...</div>
                </button>
            </div>
            <button class="buttonBack" onclick="back()">
                <img src="./assets/buttons/back.svg">
                <div>Back</div>
            </button>
        </section>
        <section class="content" id="results">
            <div id="resultsCard" class="card">
                <img class="cardFlag" id="resultsCardFlag" src="./assets/flags/Missing.svg">
                <div class="cardInfo">
                    <div class="cardTitle" id="resultsCardTitle">Loading...</div>
                    <div>Category:</div>
                    <div class="cardCategory" id="resultsCardCategory">Loading...</div>
                </div>
                <div class="cardQuote">
                    <div class="cardQuoteMark" id="cardQuoteMarkLeft">“</div>
                    <div class="cardQuoteText" id="resultsCardQuoteText">Loading...</div>
                    <div class="cardQuoteMark" id="cardQuoteMarkRight">”</div>
                    <div class="cardQuoteAuthor" id="resultsCardQuoteAuthor">Loading...</div>
                </div>
            </div>
            <div id="resultsSwitches">
                <button onclick="swap(-1)">
                    <img src="./assets/buttons/left.svg">
                </button>
                <button onclick="swap(0)">
                    <img src="./assets/buttons/missing.svg">
                    <div>Random</div>
                </button>
                <button onclick="swap(1)">
                    <img src="./assets/buttons/right.svg">
                </button>
            </div>
            <button class="buttonBack" onclick="back()">
                <img src="./assets/buttons/back.svg">
                <div>Back</div>
            </button>
        </section>
        <section class="content" id="create">
            <button class="buttonBack" onclick="back()">
                <img src="./assets/buttons/back.svg">
                <div>Back</div>
            </button>
        </section>
        <section class="content" id="about">
            <button class="buttonBack" onclick="back()">
                <img src="./assets/buttons/back.svg">
                <div>Back</div>
            </button>
        </section>
        <section class="content" id="tree">
            <button class="buttonBack" onclick="back()">
                <img src="./assets/buttons/back.svg">
                <div>Back</div>
            </button>
        </section>
        <footer id="footer">
            <a id="author" title="Quark's personal page" target="_blank" href="https://quark88.github.io">Quark 2026</a>
            <div id="socials">
                <a title="Quark on Discord" onclick="navigator.clipboard.writeText('realquark');confirm('Discord tag copied! (realquark)')">
                    <img src=" assets/logos/discord.svg">
                </a>
                <a title="Quark on X" target="_blank" href="https://x.com/RenaudBeaulieuQ">
                    <img src=" assets/logos/x.svg">
                </a>
                <a title="Quark on GitHub" target="_blank" href="https://github.com/QUARK88">
                    <img src=" assets/logos/github.svg">
                </a>
                <a title="Quark on Reddit" target="_blank" href="https://www.reddit.com/user/QK_QUARK88">
                    <img src=" assets/logos/reddit.svg">
                </a>
            </div>
        </footer>
    </div>
    <aside id="sidebarRight"></aside>
</body>
<script src="./script.js"></script>

</html>
